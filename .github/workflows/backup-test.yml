# DynamoDB PITR restore test — validates that prod backups are recoverable.
# On failure, opens or updates a GitHub issue labelled 'reliability'.
#
# ---------------------------------------------------------------------------
# THE WEEKLY SCHEDULE IS DELIBERATELY DISABLED (see issue #49).
# ---------------------------------------------------------------------------
# This check validates a PITR restore of the *production* table. Production
# does not exist yet, so every scheduled run was guaranteed to fail — it never
# passed once across its entire history, and each failure appended a "still
# failing" comment to issue #49. That is false signal, not safety: an alarm
# that has never been capable of going green trains everyone to ignore it.
#
# Three independent preconditions are unmet today:
#
#   1. `secrets.AWS_DEPLOY_ROLE_ARN` (the prod OIDC deploy role) is not
#      configured — not at repo scope, not at environment scope. The empty
#      value made `role-to-assume` vanish from the action's inputs, so the
#      run died with a cryptic "Could not load credentials from any
#      providers" after 12 retries.
#   2. The `production` GitHub environment does not exist. The deploy role's
#      trust policy pins the OIDC `sub` claim to
#      `repo:warlordofmars/channel:environment:production`
#      (infra/stacks/channel_stack.py), so a job without `environment:` could
#      not assume the role even once the secret is set. Fixed below.
#   3. There is no PITR-enabled table to restore from. PITR is prod-only —
#      `point_in_time_recovery_enabled=is_prod` in channel_stack.py — so
#      `channel-dev` and `channel-jc` both report PITR DISABLED, and the prod
#      `channel` table has never been created.
#
# RE-ENABLE CONDITION — turn the schedule back on as part of the prod
# cutover, once all three hold: the `channel` table exists with PITR enabled,
# the `production` GitHub environment exists, and `AWS_DEPLOY_ROLE_ARN` is
# wired. Uncomment the `schedule:` block below. Tracked as the follow-up
# issue linked from #49.
#
# Until then the workflow remains runnable on demand via workflow_dispatch,
# and its preflight fails fast with an actionable message instead of a
# cryptic credentials error.
name: Backup Restore Test

on:
  # Re-enable at prod cutover — see the header comment above and issue #49.
  # schedule:
  #   - cron: "0 3 * * 0"  # every Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  backup-restore-test:
    name: DynamoDB PITR Restore Test
    runs-on: ubuntu-latest
    # Required: the prod deploy role's OIDC trust policy pins the token's
    # `sub` claim to `repo:<owner>/<repo>:environment:production`. Without
    # this key the AssumeRoleWithWebIdentity call is rejected outright.
    environment: production
    env:
      RESTORE_TABLE: channel-backup-test-${{ github.run_id }}
      SOURCE_TABLE: channel
      AWS_REGION: us-east-1
      # How far back the audit-witness search walks the hour-sharded
      # AUDIT#{date}#{hour} partitions (168 = 7 days), newest first. Same
      # fan-out ceiling `storage._AUDIT_SHARD_WALK_MAX_HOURS` uses, and
      # the same reason: a targeted Query per hour beats a Scan with a
      # `begins_with(PK, "AUDIT#")` filter, which would read every
      # partition in the production table to find one row.
      AUDIT_LOOKBACK_HOURS: 168

    steps:
      # Fail fast, before any checkout or dependency install, when the prod
      # deploy role is not configured. Without this the run burns ~70s and
      # then reports "Could not load credentials from any providers", which
      # says nothing about the actual cause.
      - name: Preflight — prod deploy role configured
        id: preflight_role
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not configured; prod backup validation cannot run."
            echo "The prod OIDC deploy role secret is unset at both repo and environment scope."
            echo "This is expected until the prod cutover — see issue #459."
            echo "To resolve: deploy the prod stack, then set AWS_DEPLOY_ROLE_ARN to the"
            echo "GitHubActionsDeployRole ARN emitted by the ChannelStack prod deployment."
            exit 1
          fi
          echo "Prod deploy role secret is configured."

      # No `actions/checkout` step: every step below is an inline script or
      # an inline `github-script` block, so nothing reads a repo file.

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Verify there is actually something restorable before kicking off a
      # restore that would otherwise fail deep inside the AWS call with a
      # less obvious error.
      - name: Preflight — source table exists with PITR enabled
        run: |
          # Capture stderr so a missing table can be distinguished from
          # AccessDenied / expired credentials / throttling. Collapsing all of
          # those into "table does not exist" would be its own legibility bug.
          if ! DESCRIBE_ERR=$(aws dynamodb describe-table --table-name "$SOURCE_TABLE" 2>&1 >/dev/null); then
            case "$DESCRIBE_ERR" in
              *ResourceNotFoundException*)
                echo "::error::Source table '$SOURCE_TABLE' does not exist in $AWS_REGION; there is nothing to restore."
                echo "The prod table is created by the prod ChannelStack deployment — see issue #459."
                ;;
              *)
                echo "::error::Could not describe source table '$SOURCE_TABLE' — this is NOT a 'table missing' result, so treat it as a live failure."
                echo "$DESCRIBE_ERR"
                ;;
            esac
            exit 1
          fi

          PITR_STATUS=$(aws dynamodb describe-continuous-backups \
            --table-name "$SOURCE_TABLE" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' \
            --output text)
          echo "PITR status on $SOURCE_TABLE: $PITR_STATUS"
          if [ "$PITR_STATUS" != "ENABLED" ]; then
            echo "::error::PITR is $PITR_STATUS on '$SOURCE_TABLE' — no restorable backup exists."
            echo "PITR is enabled only for prod (point_in_time_recovery_enabled=is_prod in channel_stack.py)."
            exit 1
          fi
          echo "Preflight passed: $SOURCE_TABLE exists with PITR ENABLED."

      # The audit trail is the one row family whose entire purpose is to
      # be durable, and until #601 nothing here looked at it: the run
      # could pass with every AUDIT# row missing from the restore. An
      # item count and a GSI list cannot see that — the count is
      # dominated by chat rows and the index list says nothing about
      # contents.
      #
      # Proving durability needs a row that demonstrably existed BEFORE
      # the restore point, so this step pins that instant and picks a
      # specific witness row from the source below it. Note what it does
      # NOT do: it never writes a canary into production. Seeding a
      # synthetic row would put test data in the compliance trail whose
      # integrity is the thing under test, for 365 days — the assertion
      # would corrupt its own subject.
      - name: Capture restore point and pre-restore audit witness
        id: witness
        run: |
          # Pin the restore point explicitly instead of letting the
          # restore pick "latest" for itself. `--use-latest-restorable-time`
          # is a moving target, so there would be no instant to say the
          # witness predates.
          RESTORE_POINT=$(aws dynamodb describe-continuous-backups \
            --table-name "$SOURCE_TABLE" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.LatestRestorableDateTime' \
            --output text)
          # AWS CLI v2 renders timestamps as ISO-8601, v1 as a float
          # epoch. Both are accepted by `--restore-date-time`, so the
          # value is passed through untouched; only the epoch used for
          # comparisons below has to be normalised. Flooring a
          # fractional epoch moves the comparison point *earlier*, which
          # keeps "witness <= restore point" conservative.
          case "$RESTORE_POINT" in
            ''|None)
              echo "::error::Could not read LatestRestorableDateTime for '$SOURCE_TABLE'."
              exit 1
              ;;
            *[!0-9.]*) RESTORE_EPOCH=$(date -u -d "$RESTORE_POINT" +%s) ;;
            *) RESTORE_EPOCH=${RESTORE_POINT%%.*} ;;
          esac
          case "$RESTORE_EPOCH" in
            ''|*[!0-9]*)
              echo "::error::Could not derive a numeric epoch from the restore point '$RESTORE_POINT'."
              exit 1
              ;;
          esac
          echo "Restore point: $RESTORE_POINT (epoch $RESTORE_EPOCH)"
          echo "RESTORE_POINT=$RESTORE_POINT" >> "$GITHUB_ENV"
          echo "RESTORE_EPOCH=$RESTORE_EPOCH" >> "$GITHUB_ENV"

          # Walk AUDIT#{date}#{hour} partitions backwards from the
          # restore point, newest first, and take the first row whose
          # sort key ({unix_ts}#{uuid}) is at or below it. Descending
          # Query + `--limit 25 --no-paginate` keeps each hop to exactly
          # one bounded round trip against a single partition.
          #
          # The flag pairing is load-bearing and easy to get wrong.
          # `--limit` is DynamoDB's own Limit (items *evaluated* per
          # request); `--max-items` is only the CLI paginator's cap on
          # what it yields, so on its own it still lets one Query read up
          # to a 1 MB page. `--no-paginate` is what stops the CLI from
          # following LastEvaluatedKey and walking the whole partition
          # 25 items at a time — which `--limit` alone would make *more*
          # likely, not less.
          #
          # A candidate must also carry a non-empty `event_id`, because
          # that attribute is what the post-restore step compares. Without
          # this the selection could pick a row that has none, and the
          # "row is intact" assertion would quietly degrade to comparing
          # "" against "" — passing for a restore that returned a
          # different row, or a hollow one. Every row `put_audit_event`
          # writes has the attribute; the filter is here so the assertion
          # cannot be weakened by one that somehow doesn't.
          WITNESS_PK=""
          for OFFSET in $(seq 0 "$((AUDIT_LOOKBACK_HOURS - 1))"); do
            # Rendered from the epoch rather than a relative-date phrase
            # — `date -d "<iso> -N hours"` leans on GNU's relative-item
            # parser, and this needs to be exact, not clever.
            SHARD="AUDIT#$(date -u -d "@$((RESTORE_EPOCH - OFFSET * 3600))" +'%Y-%m-%d#%H')"
            # The sort-key bound is part of the KEY CONDITION, not just
            # the jq filter below, so the Limit caps *eligible* rows
            # rather than all rows — a key condition is applied before
            # Limit, a FilterExpression would not be. Without it, a
            # restore-point hour holding more than 25 rows newer than
            # the cutoff (PITR lags "now" by a few minutes, so recent
            # writes are all post-cutoff) would return 25 ineligible
            # rows and report no witness in that partition. Same
            # cheap-key-range / exact-filter layering
            # `storage.query_audit_events` uses.
            #
            # `{RESTORE_EPOCH + 1}` as a strict upper bound admits every
            # SK in the cutoff second: "{cutoff}#{uuid}" < "{cutoff+1}"
            # because the digit before the "#" differs. Same unpadded
            # 10-digit-era assumption as the rest of the AUDIT# readers.
            ITEMS=$(aws dynamodb query \
              --table-name "$SOURCE_TABLE" \
              --key-condition-expression "#pk = :pk AND #sk < :cut" \
              --expression-attribute-names '{"#pk":"PK","#sk":"SK"}' \
              --expression-attribute-values "{\":pk\":{\"S\":\"$SHARD\"},\":cut\":{\"S\":\"$((RESTORE_EPOCH + 1))\"}}" \
              --no-scan-index-forward \
              --limit 25 \
              --no-paginate \
              --output json)
            WITNESS=$(printf '%s' "$ITEMS" | jq -c --argjson cutoff "$RESTORE_EPOCH" \
              'first(.Items[]? | select(
                 ((.SK.S | split("#")[0] | tonumber) <= $cutoff)
                 and ((.event_id.S // "") != "")
               )) // empty')
            if [ -n "$WITNESS" ]; then
              WITNESS_PK=$(printf '%s' "$WITNESS" | jq -r '.PK.S')
              WITNESS_SK=$(printf '%s' "$WITNESS" | jq -r '.SK.S')
              # Guaranteed non-empty by the selection filter above.
              WITNESS_EVENT_ID=$(printf '%s' "$WITNESS" | jq -r '.event_id.S')
              WITNESS_EVENT_TYPE=$(printf '%s' "$WITNESS" | jq -r '.event_type.S // ""')
              echo "Audit witness: $WITNESS_PK / $WITNESS_SK (event_id=$WITNESS_EVENT_ID, type=$WITNESS_EVENT_TYPE), found $OFFSET hour(s) back."
              break
            fi
          done

          # No vacuous pass: without a witness the post-restore assertion
          # would have nothing to assert, which is the exact shape of
          # "advertising coverage that does not exist" the GSI guard
          # below already refuses.
          if [ -z "$WITNESS_PK" ]; then
            echo "::error::No usable AUDIT# row found in '$SOURCE_TABLE' within $AUDIT_LOOKBACK_HOURS hours before the restore point — the audit-durability check cannot run, and passing without it would assert nothing."
            echo "Three causes, all worth knowing about:"
            echo "  1. Nothing has written an audit event in that window. Writers are auth.logout, auth.session_revoke[_all], the memory.* verbs, and audit.read (#601). On a freshly cut-over prod this is expected: sign in and out once (or read /api/audit/events), then re-run."
            echo "  2. The writers are not firing in production at all — a real defect, and the one this check exists to surface."
            echo "  3. Rows exist in that window but none carries an event_id, so none can serve as a witness — also a real defect, since put_audit_event always writes one."
            exit 1
          fi
          echo "WITNESS_PK=$WITNESS_PK" >> "$GITHUB_ENV"
          echo "WITNESS_SK=$WITNESS_SK" >> "$GITHUB_ENV"
          echo "WITNESS_EVENT_ID=$WITNESS_EVENT_ID" >> "$GITHUB_ENV"

      - name: Restore DynamoDB table from PITR
        id: restore
        run: |
          # Restore to the instant pinned above, not to "latest": the
          # audit assertion is "a row that existed before THIS instant
          # came back", and that sentence needs a fixed instant.
          echo "Restoring $SOURCE_TABLE → $RESTORE_TABLE at $RESTORE_POINT"
          aws dynamodb restore-table-to-point-in-time \
            --source-table-name "$SOURCE_TABLE" \
            --target-table-name "$RESTORE_TABLE" \
            --restore-date-time "$RESTORE_POINT" \
            --no-sse-specification-override

          # Wait up to 20 minutes for the restore to complete
          echo "Waiting for restore to complete (up to 20 min)..."
          for i in $(seq 1 40); do
            STATUS=$(aws dynamodb describe-table \
              --table-name "$RESTORE_TABLE" \
              --query 'Table.TableStatus' \
              --output text)
            echo "  Attempt $i: status=$STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              echo "Restore complete."
              break
            fi
            if [ $i -eq 40 ]; then
              echo "Restore timed out after 20 minutes."
              exit 1
            fi
            sleep 30
          done

      - name: Validate restored table
        id: validate
        run: |
          # 1. Data check — the restore must contain items.
          COUNT=$(aws dynamodb scan \
            --table-name "$RESTORE_TABLE" \
            --select COUNT \
            --query 'Count' \
            --output text)
          echo "Restored table item count: $COUNT"
          # Reject a non-numeric count before comparing. Under `bash -e` a
          # non-numeric or empty value makes `[ "$COUNT" -lt 1 ]` exit 2, and
          # because `if` conditions are exempt from `set -e` the step would
          # sail past and report "passed: None items found" — the same
          # vacuous-pass hole the GSI guard below closes.
          case "$COUNT" in
            ''|*[!0-9]*)
              echo "::error::Could not read a numeric item count from '$RESTORE_TABLE' (got: '$COUNT')."
              exit 1
              ;;
          esac
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Restored table is empty — backup may be corrupt or PITR not enabled."
            exit 1
          fi
          echo "Item count check passed: $COUNT items found."

          # 2. Schema check — every GSI on the source must come back on the
          # restore. A restore that silently drops an index would leave the
          # app unable to serve the query paths that depend on it (e.g.
          # RefreshByUserIndex powers per-device refresh-token family revoke),
          # which an item-count check alone cannot detect.
          # The `|| `[]`` guard matters: on a table with no GSIs the
          # GlobalSecondaryIndexes key is absent entirely, and an unguarded
          # `sort(Table.GlobalSecondaryIndexes[].IndexName)` aborts with
          # "In function sort(), invalid type for value: None" — a cryptic
          # failure of exactly the kind this workflow's preflights exist to
          # eliminate. The guard yields an empty list instead.
          SOURCE_GSIS=$(aws dynamodb describe-table \
            --table-name "$SOURCE_TABLE" \
            --query 'sort((Table.GlobalSecondaryIndexes || `[]`)[].IndexName)' \
            --output text)
          RESTORED_GSIS=$(aws dynamodb describe-table \
            --table-name "$RESTORE_TABLE" \
            --query 'sort((Table.GlobalSecondaryIndexes || `[]`)[].IndexName)' \
            --output text)
          echo "Source GSIs:   $SOURCE_GSIS"
          echo "Restored GSIs: $RESTORED_GSIS"

          # Guard against a vacuous pass: the Channel schema always defines
          # GSIs, so an empty source list means describe-table returned
          # something unexpected and the parity comparison below would
          # succeed without asserting anything.
          # `None` is belt-and-braces: the `|| `[]`` guard above already makes
          # an absent key yield an empty string rather than the literal "None"
          # the AWS CLI prints for a null result. Matching both means removing
          # that guard later can't silently reintroduce a vacuous `None ==
          # None` pass. (No Channel index is named "None".)
          case "$SOURCE_GSIS" in
            ''|None)
              echo "::error::Source table '$SOURCE_TABLE' reports no GSIs — the Channel schema always defines several, so this is not a valid baseline to compare against."
              exit 1
              ;;
          esac

          if [ "$SOURCE_GSIS" != "$RESTORED_GSIS" ]; then
            echo "::error::GSI parity check failed — the restored table's indexes do not match the source."
            echo "Expected: $SOURCE_GSIS"
            echo "Actual:   $RESTORED_GSIS"
            exit 1
          fi
          echo "GSI parity check passed."

          echo "Validation passed: $COUNT items, GSIs match ($SOURCE_GSIS)."

      # The audit-durability assertion (#601). Separate from the step
      # above because it proves a different claim: not "the restore
      # produced a table", but "this specific audit row, which existed
      # before the restore point, is present and intact in the restore".
      # A row-count check cannot distinguish a restore with the whole
      # AUDIT# family missing from one without.
      - name: Validate audit trail survived the restore
        id: validate_audit
        run: |
          # Re-state the property in the log rather than trusting the
          # capture step: the witness must sit at or below the restore
          # point, so its presence below is evidence about restored
          # history and not about anything written since.
          WITNESS_EPOCH=${WITNESS_SK%%#*}
          # Reject a non-numeric prefix before comparing. Under `bash -e`
          # an `if [ "$x" -gt … ]` with a non-numeric operand exits 2,
          # and `if` conditions are exempt from `set -e`, so the step
          # would sail past — the same vacuous-pass hole the item-count
          # guard above closes.
          case "$WITNESS_EPOCH" in
            ''|*[!0-9]*)
              echo "::error::Audit witness sort key '$WITNESS_SK' does not start with a Unix timestamp; the AUDIT# key shape has changed and this check needs updating."
              exit 1
              ;;
          esac
          if [ "$WITNESS_EPOCH" -gt "$RESTORE_EPOCH" ]; then
            echo "::error::Audit witness $WITNESS_PK / $WITNESS_SK is dated after the restore point ($WITNESS_EPOCH > $RESTORE_EPOCH); it proves nothing about the restore."
            exit 1
          fi

          RESTORED=$(aws dynamodb get-item \
            --table-name "$RESTORE_TABLE" \
            --key "{\"PK\":{\"S\":\"$WITNESS_PK\"},\"SK\":{\"S\":\"$WITNESS_SK\"}}" \
            --consistent-read \
            --output json)
          if [ "$(printf '%s' "$RESTORED" | jq -r 'has("Item")')" != "true" ]; then
            echo "::error::Audit row $WITNESS_PK / $WITNESS_SK existed in '$SOURCE_TABLE' before the restore point but is ABSENT from the restore — the compliance trail is not durable."
            exit 1
          fi

          RESTORED_EVENT_ID=$(printf '%s' "$RESTORED" | jq -r '.Item.event_id.S // ""')
          if [ "$RESTORED_EVENT_ID" != "$WITNESS_EVENT_ID" ]; then
            echo "::error::Restored audit row $WITNESS_PK / $WITNESS_SK came back with event_id '$RESTORED_EVENT_ID', expected '$WITNESS_EVENT_ID' — the row is present but not intact."
            exit 1
          fi

          # Context for the log, not a gate: how much of that partition
          # came back alongside the witness.
          PARTITION_COUNT=$(aws dynamodb query \
            --table-name "$RESTORE_TABLE" \
            --key-condition-expression "#pk = :pk" \
            --expression-attribute-names '{"#pk":"PK"}' \
            --expression-attribute-values "{\":pk\":{\"S\":\"$WITNESS_PK\"}}" \
            --select COUNT \
            --query 'Count' \
            --output text)
          echo "Audit durability check passed: $WITNESS_PK / $WITNESS_SK (event_id=$WITNESS_EVENT_ID) survived the restore; $PARTITION_COUNT row(s) in that partition."

      # Skipped when the restore step never ran (e.g. a preflight failed), so
      # cleanup can't burn the credential-provider chain deleting a table that
      # was never created.
      - name: Delete temporary restore table
        if: always() && steps.restore.outcome != 'skipped'
        run: |
          echo "Cleaning up temporary table $RESTORE_TABLE..."
          aws dynamodb delete-table --table-name "$RESTORE_TABLE" || true
          echo "Cleanup complete."

      # Suppressed when the run failed *only* because the prod deploy role
      # isn't configured yet — that is the documented, expected pre-cutover
      # state (issue #459), not a backup-chain problem. Filing a bug for it on
      # every manual dispatch would recreate the exact false signal this
      # workflow's schedule was disabled to stop: #49 is closed, and #459's
      # title doesn't match the predicate below, so each run would open a
      # brand-new reliability bug.
      #
      # Deliberately narrower than "suppress unless restore/validate failed":
      # a credentials failure, a missing source table, or PITR switched off
      # ARE genuine alarms once prod exists, and must still file.
      - name: Open or update issue on failure
        if: failure() && steps.preflight_role.outcome != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'reliability',
            });
            const existing = issues.find(i => i.title.includes('DynamoDB backup restore test failing'));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'DynamoDB backup restore test failing',
                body: `## Backup Restore Failure\n\nThe DynamoDB PITR restore test failed, indicating a potential issue with the prod backup chain.\n\nSee the [workflow run](${run_url}) for details — the preflight steps report which precondition was not met.\n\n**Action required:** Verify PITR is enabled on the \`channel\` table and investigate the restore failure.`,
                labels: ['reliability', 'bug'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Backup restore test still failing. [Run](${run_url})`,
              });
            }
