name: Deploy Dev (manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Equivalent to passing `--locked` to every uv command in this workflow —
# see the package-install hardening note at the top of ci.yml (#441).
env:
  UV_LOCKED: "1"

jobs:
  deploy-dev:
    name: CDK Deploy (dev)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK
        run: npm install -g --ignore-scripts aws-cdk@2.1134.0

      - name: Install Python dependencies
        # `--no-build` is not applicable here — see the package-install
        # hardening note at the top of .github/workflows/ci.yml.
        run: uv sync --group dev --group infra

      - name: Build React UI
        working-directory: ui
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: npm ci --ignore-scripts && npm run build

      - name: Build docs site
        working-directory: docs-site
        run: npm ci --ignore-scripts && npm run build

      - name: Deploy
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: uv run --locked --no-sync --no-build inv deploy --env dev
