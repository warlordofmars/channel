name: desktop-build

on:
  pull_request:
    paths:
      - "desktop/**"
      - "ui/**"
      - "src/channel/auth/**"
      - ".github/workflows/desktop-build.yml"
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
            binary: desktop/release/mac-arm64/Channel.app/Contents/MacOS/Channel
          - os: windows-latest
            target: --win
            binary: desktop/release/win-unpacked/Channel.exe
          - os: ubuntu-latest
            target: --linux
            binary: desktop/release/linux-unpacked/channel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install ui deps + build SPA
        shell: bash
        run: |
          cd ui
          npm install
          VITE_API_BASE=https://channel.warlordofmars.net npm run build

      - name: Install desktop deps
        shell: bash
        run: |
          cd desktop
          npm install

      - name: Desktop unit tests + 100% coverage gate
        shell: bash
        run: |
          cd desktop
          npm run test:coverage

      - name: Build packaged app
        shell: bash
        run: |
          cd desktop
          npm run build:main
          npm run build:renderer
          npx electron-builder ${{ matrix.target }}

      - name: Smoke test (Linux uses xvfb)
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a env CHANNEL_DESKTOP_BIN="$PWD/${{ matrix.binary }}" node desktop/test/smoke.js
          else
            CHANNEL_DESKTOP_BIN="$PWD/${{ matrix.binary }}" node desktop/test/smoke.js
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: channel-desktop-${{ matrix.os }}
          path: desktop/release/
          retention-days: 30
