name: CI / Deploy

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimal default permissions — jobs that need more declare their own.
permissions:
  contents: read

# ── CI jobs (run on every push and PR) ────────────────────────────────────────

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy src/channel

      - name: Copyright headers
        run: uv run python scripts/check_copyright.py


  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package.json

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Install Node dependencies
        working-directory: ui
        run: npm install

      - name: pip-audit
        # CVE-2026-3219 / CVE-2026-6357 / PYSEC-2026-196 all affect the pip
        # bundled with the venv itself, not anything in our pyproject.toml.
        # pip is build-time only — the deployed Lambda runtime has no pip.
        #
        # PYSEC-2026-1325 (= CVE-2024-23342, GHSA-wj6h-64fc-37mp) is the
        # Minerva timing attack on P-256 ECDSA *signing* in python-ecdsa,
        # a python-jose transitive dep. No fixed release exists — upstream
        # declares side-channel attacks out of scope with no planned fix.
        # Channel signs mgmt JWTs with HS256 (HMAC), never ECDSA, so the
        # vulnerable signing/keygen paths are unused at runtime; signature
        # verification is unaffected per the advisory.
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-1325

      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Trivy — dependency scan (table, for log visibility)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore

      - name: Trivy — dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-deps.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore
          limit-severities-for-sarif: "true"

      - name: Upload Trivy dependency results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

      - name: Gitleaks — secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install dependencies
        # ``--group infra`` pulls aws-cdk-lib/constructs/cdk-nag so the
        # CDK-template assertion tests in tests/unit/test_channel_stack.py
        # can synth ChannelStack without ImportError.
        run: uv sync --all-extras --group infra

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --cov=src/channel --cov-report=xml:coverage-unit.xml

      - name: Write coverage summary
        if: always()
        run: |
          echo "## Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage-unit.xml

  integration-tests:
    name: Integration Tests (DynamoDB Local)
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install dependencies
        # See note in unit-tests job — ``--group infra`` is needed for
        # the CDK-template assertion test that runs in this combined
        # unit + integration run.
        run: uv sync --all-extras --group infra

      - name: Run combined unit + integration tests with coverage
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: us-east-1
          STARTER_JWT_SECRET: test-secret
          STARTER_TABLE_NAME: starter-integration
        run: uv run pytest tests/unit tests/integration -v --cov=src/channel --cov-report=xml:coverage-combined.xml --cov-fail-under=100

      - name: Write coverage summary
        if: always()
        run: |
          echo "## Combined Test Coverage" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload combined coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: coverage-combined.xml

  coverage:
    name: Coverage Report
    needs: [unit-tests, integration-tests, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame/new-code detection

      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-unit

      - name: Download combined coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-combined

      - name: Download JS coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-js

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // Parse Python unit coverage XML
            const xml = fs.readFileSync('coverage-unit.xml', 'utf8');
            const lineRate = parseFloat(xml.match(/line-rate="([^"]+)"/)?.[1] ?? '0');
            const pct = (lineRate * 100).toFixed(1);
            const emoji = lineRate >= 0.9 ? '🟢' : lineRate >= 0.8 ? '🟡' : '🔴';

            // Build Python module rows from XML
            const rows = [];
            const classMatches = [...xml.matchAll(/<class[^>]*filename="([^"]*)"[^>]*line-rate="([^"]*)"[^>]*>/g)];
            for (const m of classMatches) {
              const name = m[1].replace('src/', '');
              const rate = (parseFloat(m[2]) * 100).toFixed(0);
              const bar = rate >= 90 ? '🟢' : rate >= 80 ? '🟡' : '🔴';
              rows.push(`| \`${name}\` | ${rate}% | ${bar} |`);
            }

            // Parse JS lcov coverage — sum lines found/hit across all files
            let jsLines = 0, jsHit = 0;
            const jsRows = [];
            try {
              const lcov = fs.readFileSync('lcov.info', 'utf8');
              let curFile = null, curFound = 0, curHit = 0;
              for (const line of lcov.split('\n')) {
                if (line.startsWith('SF:')) {
                  curFile = line.slice(3).replace(/^.*\/src\//, 'src/');
                  curFound = 0; curHit = 0;
                } else if (line.startsWith('LF:')) {
                  curFound = parseInt(line.slice(3), 10);
                  jsLines += curFound;
                } else if (line.startsWith('LH:')) {
                  curHit = parseInt(line.slice(3), 10);
                  jsHit += curHit;
                } else if (line === 'end_of_record' && curFile) {
                  const r = curFound > 0 ? (curHit / curFound * 100).toFixed(0) : '100';
                  const b = parseInt(r) >= 90 ? '🟢' : parseInt(r) >= 80 ? '🟡' : '🔴';
                  jsRows.push(`| \`${curFile}\` | ${r}% | ${b} |`);
                  curFile = null;
                }
              }
            } catch (_) { /* lcov not available */ }

            const jsPct = jsLines > 0 ? (jsHit / jsLines * 100).toFixed(1) : null;
            const jsEmoji = jsPct !== null ? (parseFloat(jsPct) >= 90 ? '🟢' : '🟡') : '⚪';

            const body = [
              `<!-- coverage-report -->`,
              `## Coverage Report`,
              ``,
              `### ${emoji} Python — ${pct}%`,
              ``,
              `| File | Cover | |`,
              `|:---|---:|:---|`,
              ...rows,
              ``,
              ...(jsPct !== null ? [
                `### ${jsEmoji} JavaScript — ${jsPct}%`,
                ``,
                `| File | Cover | |`,
                `|:---|---:|:---|`,
                ...jsRows,
                ``,
              ] : []),
              `> [full run](${context.payload.pull_request.html_url}/checks)`,
            ].join('\n');

            // Find existing comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- coverage-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Detect whether SonarCloud is configured for this fork.
      # A fresh fork won't have SONAR_TOKEN set yet — the SonarCloud project
      # must be created and the token generated through the SonarCloud UI
      # before the scan can run. Without this gate the scanner fails the
      # whole Coverage Report job, which cascades to Deploy / E2E / Release.
      # See #54 for the bootstrap-pattern context and the onboarding doc
      # update that walks through the SonarCloud setup steps.
      #
      # When SONAR_TOKEN is unset, this step emits a `::warning::`
      # annotation (visible in the GitHub Actions run summary, not just
      # the step logs) so that an accidental secret deletion in a repo
      # that previously had SonarCloud configured is loudly surfaced
      # rather than silently fail-open. The skip is the right behaviour
      # for fresh forks (which is why the job doesn't fail), but the
      # warning ensures the operator notices on every PR until the
      # secret is restored.
      #
      # Emits `configured=true` only when the secret is non-empty AND the
      # PR isn't from Dependabot (Dependabot PRs run with a restricted
      # GITHUB_TOKEN and have no access to repo secrets — see #120).
      - name: Check SonarCloud configured
        id: sonar_configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Order matters: check Dependabot first. Dependabot PRs run
          # with no access to repo secrets, so SONAR_TOKEN is also empty
          # there — if the empty-token branch ran first it would emit a
          # misleading "secret may have been accidentally deleted"
          # warning on every Dependabot PR. The Dependabot path is the
          # expected/known case; the empty-token-on-non-Dependabot path
          # is the surfaced one.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR — skipping SonarCloud steps (no secret access, see #120)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::warning title=SonarCloud skipped::SONAR_TOKEN is not set — SonarCloud scan skipped. Fresh fork? See .claude/agents/onboarding.md Phase 4.5. Canonical repo? The secret may have been accidentally deleted (issue #54)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "SonarCloud is configured — scan will run."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        if: steps.sonar_configured.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # SonarCloud free plan only supports one main branch (development).
          # Quality gate status API returns 'not found' for main, so skip the
          # wait on main-branch pushes; keep it enforced on development + PRs.
          args: ${{ github.ref == 'refs/heads/main' && '-Dsonar.qualitygate.wait=false' || '' }}

      - name: Fetch SonarCloud issues as SARIF
        if: always() && steps.sonar_configured.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?projectKeys=warlordofmars_channel&resolved=false&types=VULNERABILITY,SECURITY_HOTSPOT&ps=500" \
            -o sonar-issues.json
          python3 scripts/sonar_to_sarif.py sonar-issues.json sonar.sarif

      - name: Upload SonarCloud results to GitHub Security
        if: always() && steps.sonar_configured.outputs.configured == 'true'
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        with:
          sarif_file: sonar.sarif
          category: sonarcloud

      - name: Upload to Codecov
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-unit.xml,coverage-combined.xml,lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package.json

      - name: Install dependencies
        run: npm install

      - name: Run vitest with coverage
        run: npm run test:coverage -- --reporter=verbose

      - name: Build
        run: npm run build

      - name: Build docs site
        working-directory: docs-site
        run: npm install && npm run build

      - name: Write JS coverage summary
        if: always()
        run: |
          echo "## Frontend Test Coverage" >> $GITHUB_STEP_SUMMARY
          node - << 'EOF'
          const fs = require('fs');
          const lcov = fs.readFileSync('coverage/lcov.info', 'utf8');
          let totalFound = 0, totalHit = 0;
          const rows = [];
          let curFile = null, curFound = 0, curHit = 0;
          for (const line of lcov.split('\n')) {
            if (line.startsWith('SF:')) {
              curFile = line.slice(3).replace(/^.*\/src\//, 'src/');
              curFound = 0; curHit = 0;
            } else if (line.startsWith('LF:')) {
              curFound = parseInt(line.slice(3), 10);
              totalFound += curFound;
            } else if (line.startsWith('LH:')) {
              curHit = parseInt(line.slice(3), 10);
              totalHit += curHit;
            } else if (line === 'end_of_record' && curFile) {
              const pct = curFound > 0 ? (curHit / curFound * 100).toFixed(0) : 100;
              const bar = pct >= 90 ? '🟢' : pct >= 80 ? '🟡' : '🔴';
              rows.push(`| \`${curFile}\` | ${pct}% | ${bar} |`);
              curFile = null;
            }
          }
          const total = totalFound > 0 ? (totalHit / totalFound * 100).toFixed(1) : 100;
          const summary = [
            `| File | Lines | |`,
            `|:---|---:|:---|`,
            ...rows,
            ``,
            `**Total: ${total}%**`,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          EOF

      - name: Upload JS coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: ui/coverage/lcov.info

  desktop:
    name: "Desktop build (${{ matrix.os }})"
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
            binary: desktop/release/mac-universal/Channel.app/Contents/MacOS/Channel
          - os: windows-latest
            target: --win
            binary: desktop/release/win-unpacked/Channel.exe
          - os: ubuntu-latest
            target: --linux
            binary: desktop/release/linux-unpacked/channel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Resolve per-branch desktop build settings
        id: api-base
        shell: bash
        run: |
          # main → prod identity, anything else (development, PRs) → dev
          # identity. We separate the two by both name AND macOS bundle
          # ID so a tester can install both side-by-side without one
          # replacing the other.
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "url=https://channel.warlordofmars.net" >> "$GITHUB_OUTPUT"
            echo "product_name=Channel" >> "$GITHUB_OUTPUT"
            echo "app_id=net.warlordofmars.channel.desktop" >> "$GITHUB_OUTPUT"
            echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://channel-dev.warlordofmars.net" >> "$GITHUB_OUTPUT"
            echo "product_name=Channel - Dev" >> "$GITHUB_OUTPUT"
            echo "app_id=net.warlordofmars.channel.desktop.dev" >> "$GITHUB_OUTPUT"
            # Dev version is monotonic via GH run number plus the short
            # SHA so two CI runs on the same branch tip still differ.
            # Format matches npm/semver pre-release: $BASE-dev.$N-$SHA
            SHA=$(git rev-parse --short=7 HEAD)
            echo "version=${BASE_VERSION}-dev.${{ github.run_number }}-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ui deps + build SPA
        shell: bash
        run: |
          cd ui
          npm ci
          VITE_API_BASE=${{ steps.api-base.outputs.url }} npm run build

      - name: Install desktop deps
        shell: bash
        run: |
          cd desktop
          npm ci

      - name: Desktop unit tests + 100% coverage gate
        shell: bash
        run: |
          cd desktop
          npm run test:coverage

      - name: Build packaged app
        shell: bash
        env:
          # electron-builder expands `publish.url: "${env.UPDATES_FEED_URL}"`
          # at config-parse time even when --publish=never is set; without
          # a value the matrix build errors. The real signed+published flow
          # in `publish-desktop-mac` overrides this env to the channel URL.
          UPDATES_FEED_URL: https://example.invalid
          # Baked into the main process bundle by scripts/build-main.js.
          CHANNEL_API_BASE: ${{ steps.api-base.outputs.url }}
        run: |
          cd desktop
          # Bake the resolved version into package.json before electron-builder
          # reads it. Defaults stay at 0.0.0 in git; CI populates a real value
          # (semver tag on main, $BASE-dev.$RUN-$SHA on other branches).
          npm version --no-git-tag-version "${{ steps.api-base.outputs.version }}"
          npm run build:main
          npm run build:renderer
          # --config.mac.hardenedRuntime=false: see sub-project B PR #81 — the
          # matrix builds are unsigned and macOS 15 (Sequoia) refuses to load
          # an ad-hoc outer + Electron-signed inner with strict Team ID checks
          # when hardenedRuntime is on. Override to false for the matrix only.
          #
          # --config.productName + --config.appId give the dev variant a
          # distinct dock name ("Channel - Dev") and bundle ID so a tester
          # can have both prod and dev installed at the same time.
          npx electron-builder ${{ matrix.target }} --publish=never \
            --config.mac.hardenedRuntime=false \
            --config.mac.gatekeeperAssess=false \
            --config.productName="${{ steps.api-base.outputs.product_name }}" \
            --config.appId="${{ steps.api-base.outputs.app_id }}"

      - name: Smoke test (Linux uses xvfb)
        shell: bash
        run: |
          # The matrix.binary paths assume productName="Channel". When the
          # build runs on dev/PR branches, productName becomes "Channel - Dev"
          # and the .app folder + Windows .exe name change. Linux stays at
          # `channel` via linux.executableName in electron-builder.yml.
          PRODUCT="${{ steps.api-base.outputs.product_name }}"
          case "${{ matrix.os }}" in
            macos-14)        BIN="desktop/release/mac-universal/$PRODUCT.app/Contents/MacOS/$PRODUCT" ;;
            windows-latest)  BIN="desktop/release/win-unpacked/$PRODUCT.exe" ;;
            ubuntu-latest)   BIN="desktop/release/linux-unpacked/channel" ;;
          esac
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a env CHANNEL_DESKTOP_BIN="$PWD/$BIN" node desktop/test/smoke.js
          else
            CHANNEL_DESKTOP_BIN="$PWD/$BIN" node desktop/test/smoke.js
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: channel-desktop-${{ matrix.os }}
          path: desktop/release/
          retention-days: 30

  publish-dev-artifacts:
    name: Publish dev download artifacts
    needs: [desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ci-artifacts

      - name: Collect platform artifacts (electron-builder already emits canonical names)
        run: |
          set -euo pipefail
          mkdir -p dist
          # electron-builder.yml sets artifactName per platform so the build
          # outputs are already in the stable-URL form. Just move them into
          # a single dist/ directory for gh release create. Universal mac
          # build → one Channel-mac.dmg; arm64+x64 split is gone.
          mv "ci-artifacts/channel-desktop-macos-14/Channel-mac.dmg"             dist/Channel-mac.dmg
          mv "ci-artifacts/channel-desktop-windows-latest/Channel-Setup.exe"     dist/Channel-Setup.exe
          mv "ci-artifacts/channel-desktop-ubuntu-latest/Channel-linux.AppImage" dist/Channel-linux.AppImage
          mv "ci-artifacts/channel-desktop-ubuntu-latest/Channel-linux.deb"      dist/Channel-linux.deb
          mv "ci-artifacts/channel-desktop-ubuntu-latest/Channel-linux.rpm"      dist/Channel-linux.rpm
          ls -la dist/

      - name: Force-update `dev` pre-release with new artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Remove the existing dev release + tag so we can recreate them
          # against the current commit. --cleanup-tag drops the git tag too.
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev dist/* \
            --prerelease \
            --target development \
            --title "Channel dev preview (auto-updated)" \
            --notes "Unsigned development builds, force-updated on every push to \`development\`. Expect OS-level warnings (macOS Gatekeeper / Windows SmartScreen). Linux AppImage needs \`chmod +x\` after download. **No auto-update.** Re-download for the latest dev build."

  infra-synth:
    name: Infra Synth
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        run: uv sync --group dev --group infra

      - name: Synth prod stack
        working-directory: infra
        run: cdk synth ChannelStack --no-staging -c env=prod -c hosted_zone_id=${{ vars.HOSTED_ZONE_ID }}

      - name: Synth dev stack
        working-directory: infra
        run: cdk synth ChannelStack-dev --no-staging -c env=dev -c hosted_zone_id=${{ vars.HOSTED_ZONE_ID }}

      - name: Trivy — IaC scan (table, for log visibility)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/cdk.out/
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Trivy — IaC scan (CloudFormation templates)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/cdk.out/
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL
          # cdk-nag is the hard gate for IaC security (fails synth on violations).
          # Trivy IaC is informational — findings go to the Security tab.
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload Trivy IaC results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@f94817b9f0deeb3871261446912ae8f854d1b675 # codeql-bundle-v2.25.1
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

# ── Publish signed mac auto-update artefacts (push to main|development only) ──

  publish-desktop-mac:
    name: Publish desktop (macOS)
    needs: [desktop]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: macos-14
    # GitHub environment picks up the right AWS_*_DEPLOY_ROLE_ARN secret
    # per branch (development pushes use the development env's secret,
    # main pushes use production's).
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      id-token: write
      contents: write   # for `gh release upload` on the main branch path
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && secrets.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve channel + env
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "cdk_env=prod"   >> "$GITHUB_OUTPUT"
            echo "domain=channel.warlordofmars.net" >> "$GITHUB_OUTPUT"
            echo "product_name=Channel" >> "$GITHUB_OUTPUT"
            echo "app_id=net.warlordofmars.channel.desktop" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev"    >> "$GITHUB_OUTPUT"
            echo "cdk_env=dev"    >> "$GITHUB_OUTPUT"
            echo "domain=channel-dev.warlordofmars.net" >> "$GITHUB_OUTPUT"
            echo "product_name=Channel - Dev" >> "$GITHUB_OUTPUT"
            echo "app_id=net.warlordofmars.channel.desktop.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Read CDK outputs
        id: cdk
        run: |
          CDK_ENV="${{ steps.env.outputs.cdk_env }}"
          STACK="ChannelStack$([[ "$CDK_ENV" == "dev" ]] && echo "-dev")"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='UpdatesBucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='UpdatesDistributionId'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        working-directory: desktop
        run: |
          BASE=$(node -p "require('./package.json').version")
          CHANNEL="${{ steps.env.outputs.channel }}"
          if [[ "$CHANNEL" == "dev" ]]; then
            VERSION="${BASE}-dev.${{ github.run_number }}"
          else
            VERSION="${BASE}"
          fi
          npm version --no-git-tag-version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Apple signing cert
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN=channel-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f /tmp/cert.p12

      - name: Install ui deps + build SPA
        shell: bash
        run: |
          cd ui
          npm ci
          VITE_API_BASE=https://${{ steps.env.outputs.domain }} npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build + sign + notarise
        working-directory: desktop
        env:
          UPDATES_FEED_URL: https://${{ steps.env.outputs.domain }}/updates/${{ steps.env.outputs.channel }}
          # Baked into the main-process bundle so the packaged app connects
          # to the channel-specific API (channel.warlordofmars.net for main,
          # channel-dev.warlordofmars.net for development).
          CHANNEL_API_BASE: https://${{ steps.env.outputs.domain }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          npm run build:main
          npm run build:renderer
          # productName + appId per branch so the dev signed build installs
          # under "Channel - Dev" alongside the prod "Channel" without
          # collision. artifactName overrides in electron-builder.yml keep
          # the .dmg filename as the stable "Channel-mac.dmg" regardless.
          npx electron-builder --mac --publish=never \
            --config.productName="${{ steps.env.outputs.product_name }}" \
            --config.appId="${{ steps.env.outputs.app_id }}"

      - name: Generate latest-mac.yml (electron-updater manifest)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `electron-builder --publish=never` skips the entire publish
          # phase, INCLUDING latest-mac.yml generation. We compute the
          # manifest ourselves from the .zip electron-builder produced
          # — same format `electron-updater` expects (version + file
          # entry with base64 SHA-512 + size + releaseDate).
          cd desktop/release
          # Filename is deterministic from electron-builder.yml's mac.zip
          # artifactName template: `Channel-${version}-${os}.${ext}`.
          # Compute it from VERSION rather than globbing — globbing fails
          # silently under `set -e` if no match (ls exits non-zero, step
          # aborts before any error message we'd write).
          ZIP="Channel-${VERSION}-mac.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "::error::expected $ZIP in desktop/release/ but found:"
            ls -la
            exit 1
          fi
          SHA=$(openssl dgst -sha512 -binary "$ZIP" | openssl base64 -A)
          SIZE=$(stat -f %z "$ZIP" 2>/dev/null || stat -c %s "$ZIP")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${ZIP}
              sha512: ${SHA}
              size: ${SIZE}
          path: ${ZIP}
          sha512: ${SHA}
          releaseDate: '${RELEASE_DATE}'
          EOF
          echo "Generated latest-mac.yml:"
          cat latest-mac.yml

      - name: Upload versioned auto-update bundles to S3 (tagged for lifecycle)
        env:
          BUCKET: ${{ steps.cdk.outputs.bucket }}
          CHANNEL: ${{ steps.env.outputs.channel }}
        run: |
          # `aws s3 cp` (high-level wrapper) doesn't accept --tagging either
          # — only `aws s3api put-object` does. PR #214 mistakenly assumed
          # `cp` supported it; this corrects with a two-step pattern:
          # upload via `cp`, then tag via `s3api put-object-tagging`. The
          # lifecycle rule in infra/stacks/channel_stack.py expires objects
          # tagged channel-asset-type=versioned-zip after 30 days.
          shopt -s nullglob
          for f in desktop/release/*.zip desktop/release/*.blockmap; do
            KEY="updates/${CHANNEL}/$(basename "$f")"
            aws s3 cp "$f" "s3://${BUCKET}/${KEY}"
            aws s3api put-object-tagging \
              --bucket "$BUCKET" \
              --key "$KEY" \
              --tagging 'TagSet=[{Key=channel-asset-type,Value=versioned-zip}]'
          done

      - name: Sync stable artefacts (dmg + manifest) to S3 (untagged)
        run: |
          aws s3 cp desktop/release/Channel-mac.dmg \
            s3://${{ steps.cdk.outputs.bucket }}/updates/${{ steps.env.outputs.channel }}/Channel-mac.dmg \
            --cache-control "public, max-age=300"
          aws s3 cp desktop/release/latest-mac.yml \
            s3://${{ steps.cdk.outputs.bucket }}/updates/${{ steps.env.outputs.channel }}/latest-mac.yml \
            --cache-control "public, max-age=60"

      - name: Invalidate CloudFront for the manifest + stable dmg
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cdk.outputs.distribution }} \
            --paths "/updates/${{ steps.env.outputs.channel }}/latest-mac.yml" \
                    "/updates/${{ steps.env.outputs.channel }}/Channel-mac.dmg"

      - name: Upload signed assets to GitHub release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Wait up to 5 min for the release to be created by the `release` job.
          for i in {1..30}; do
            if gh release view "v$VERSION" >/dev/null 2>&1; then break; fi
            echo "Waiting for release v$VERSION to exist... ($i/30)"
            sleep 10
          done
          gh release upload "v$VERSION" \
            desktop/release/Channel-mac.dmg \
            desktop/release/*.exe \
            desktop/release/*.deb \
            desktop/release/*.rpm \
            desktop/release/*.AppImage \
            --clobber

  notify-pipeline-failure:
    name: Notify Slack — CI Failure
    needs: [lint-typecheck, audit, unit-tests, integration-tests, coverage, frontend, desktop, infra-synth, publish-desktop-mac]
    if: >-
      always() &&
      contains(needs.*.result, 'failure') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: CI pipeline failed on *${{ github.ref_name }}*",
              "attachments": [{
                "color": "danger",
                "text": "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }

# ── Deploy to dev (push to development) ───────────────────────────────────────

  deploy-dev:
    name: Deploy (dev)
    needs: [lint-typecheck, audit, unit-tests, integration-tests, coverage, frontend, desktop, infra-synth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    outputs:

      api_url: ${{ steps.urls.outputs.api_url }}
      ui_url: ${{ steps.urls.outputs.ui_url }}
      public_url: ${{ steps.urls.outputs.public_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        run: uv sync --group dev --group infra

      - name: Build React UI
        working-directory: ui
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          # Marketing Download page → /releases/download/dev/<asset> on
          # the dev site (ADR-0010). ``inv deploy --env dev`` rebuilds
          # the SPA and propagates the same value via tasks.py, but
          # setting it here keeps the explicit build step's output
          # consistent with the deployed bundle in case the deploy
          # task ever drops the rebuild.
          VITE_RELEASE_CHANNEL: dev
        run: npm install && npm run build

      - name: Build docs site
        working-directory: docs-site
        run: npm install && npm run build

      - name: Deploy dev stack
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_RELEASE_CHANNEL: dev
        run: uv run inv deploy --env dev

      - name: Export stack URLs
        id: urls
        run: |
          STACK=ChannelStack-dev
          query() { aws cloudformation describe-stacks --stack-name $STACK --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "api_url_direct=$(query ApiFunctionUrl)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(query ApiFunctionUrl)"  >> "$GITHUB_OUTPUT"
          echo "ui_url=$(query UiUrl)"            >> "$GITHUB_OUTPUT"
          # public_url is the CloudFront distribution URL — the same edge
          # endpoint that serves the UI, which CloudFront also routes to
          # the API origin under /api, /auth, /oauth, /.well-known, /health.
          # Smoke tests hit this so they exercise the full edge path
          # (CloudFront injects X-Origin-Verify, which the Lambda's
          # _verify_origin_secret middleware requires — see #127).
          echo "public_url=$(query UiUrl)"        >> "$GITHUB_OUTPUT"

      - name: Notify Slack — deploy success
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: Deploy to *dev* succeeded",
              "attachments": [{
                "color": "good",
                "text": "API: ${{ steps.urls.outputs.api_url }}\nUI: ${{ steps.urls.outputs.ui_url }}"
              }]
            }

      - name: Notify Slack — deploy failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: Deploy to *dev* failed",
              "attachments": [{
                "color": "danger",
                "text": "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }

  e2e-dev:
    name: E2E Tests (dev)
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      # The six per-suite e2e test files (test_auth_e2e.py, test_mcp_e2e.py,
      # test_admin_e2e.py, test_ui_e2e.py, test_docs_e2e.py,
      # test_dashboard_e2e.py) were removed during the #47-era scaffolding
      # strip-down. Until proper e2e suites are reauthored against the
      # current API/UI surface (tracked separately), this job runs a
      # single smoke check against the deployed dev API — green smoke
      # proves the Lambda is up and reachable through CloudFront from
      # the runner, validating the full edge → Lambda chain (see #127).
      # Mirrors the e2e-prod "Smoke test prod API" precedent below.
      - name: Smoke test dev API
        env:
          # Hit the CloudFront distribution, NOT the Lambda Function URL
          # directly. CloudFront injects the X-Origin-Verify header that
          # the Lambda's _verify_origin_secret middleware requires (see #127);
          # bypassing CloudFront returns 403. CloudFront's /health behaviour
          # forwards to the API origin, so /health is reachable through
          # the edge. Hitting through CloudFront also validates the full
          # edge path the way real traffic flows.
          STARTER_PUBLIC_URL: ${{ needs.deploy-dev.outputs.public_url }}
        run: |
          # /health must return JSON with .status == 'ok' on a healthy
          # Lambda. AWSLWA returns HTTP 200 even on init failure (the
          # error response body is whatever the runtime emitted — often
          # plaintext like 'Runtime.ImportModuleError: ...', sometimes
          # JSON), so status-only smoke is structurally incapable of
          # catching init failures. Do not unwind this assertion without
          # filing a replacement defense — see #111.
          # -sS surfaces curl-side errors (DNS/TLS/connectivity) instead
          # of silently hiding them; --connect-timeout / --max-time
          # prevent indefinite hangs.
          RESPONSE=$(curl -sS --connect-timeout 5 --max-time 15 -w "\nHTTP_CODE:%{http_code}" "${STARTER_PUBLIC_URL%/}/health")
          STATUS=$(printf '%s\n' "$RESPONSE" | tail -n 1 | sed 's/^HTTP_CODE://')
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          echo "Health check status: $STATUS"
          # Print the body inside a workflow-command group, with each line
          # prefixed, so a malicious/malformed body cannot inject Actions
          # workflow commands (lines starting with '::...' are interpreted
          # by the runner otherwise). Use printf to avoid echo's
          # implementation-defined handling of leading '-n'/'-e' tokens.
          echo "::group::Health check body"
          printf '%s\n' "$BODY" | sed 's/^/  /'
          echo "::endgroup::"
          [ "$STATUS" = "200" ] || (echo "Dev health check HTTP status not 200!" && exit 1)
          HEALTH_STATUS=$(printf '%s\n' "$BODY" | jq -r '.status') || (echo "Dev health check body is not valid JSON!" && exit 1)
          [ "$HEALTH_STATUS" = "ok" ] || (echo "Dev health check .status != 'ok' (got: $HEALTH_STATUS)" && exit 1)

      - name: Notify Slack — e2e failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: E2E tests failed on *dev* after deploy",
              "attachments": [{
                "color": "danger",
                "text": "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }

# ── Release + deploy to prod (push to main) ───────────────────────────────────

  release:
    name: Release
    needs: [lint-typecheck, audit, unit-tests, integration-tests, coverage, frontend, desktop, infra-synth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0   # needed for git describe to find the previous tag

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Infer version and create release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(uv run inv version)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Idempotency: if the tag already exists on origin, verify it
          # points at the current HEAD commit. If the existing tag is on
          # a DIFFERENT SHA (e.g. created by mistake or by a previous
          # buggy run), halt — silently advancing past would publish a
          # release that doesn't reflect the merged main commit.
          # publish-desktop-mac waits up to 5 min for `gh release view`,
          # so as long as the release exists *and* the tag matches HEAD,
          # the downstream step is happy.
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if [ -n "$REMOTE_TAG_SHA" ]; then
            # ls-remote prints the tag-object SHA for annotated tags; resolve
            # to the commit it points to via the ^{} peeled-ref form.
            REMOTE_TAG_COMMIT=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
            REMOTE_COMMIT="${REMOTE_TAG_COMMIT:-$REMOTE_TAG_SHA}"
            if [ "$REMOTE_COMMIT" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG exists on origin at $REMOTE_COMMIT, not HEAD ($HEAD_SHA). Halting — manual cleanup required."
              exit 1
            fi
            echo "Tag $TAG already exists on origin at HEAD — skipping tag creation"
          else
            # Annotated tag so `git describe` and `git for-each-ref` show
            # the release as a proper release point, not a lightweight ref.
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping release creation"
            exit 0
          fi

          # Prefer the curated CHANGELOG section as the release body; fall
          # back to auto-generated notes if no section exists yet (e.g. an
          # automated release for a version that wasn't pre-curated).
          uv run python scripts/extract_changelog.py "$VERSION" > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Using curated CHANGELOG.md section as release body"
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            echo "No CHANGELOG.md section for $VERSION — using --generate-notes"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  deploy-prod:
    name: Deploy (prod)
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    outputs:

      api_url: ${{ steps.urls.outputs.api_url }}
      ui_url: ${{ steps.urls.outputs.ui_url }}
      public_url: ${{ steps.urls.outputs.public_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        run: uv sync --group dev --group infra

      - name: Build React UI
        working-directory: ui
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          # Marketing Download page → /releases/latest/download/<asset> on
          # prod (ADR-0010 — the GitHub redirect that resolves to the most
          # recent non-prerelease release at click time). ``latest`` is
          # also the Download.jsx default when the var is unset, but
          # making it explicit keeps the per-env split visible in CI.
          VITE_RELEASE_CHANNEL: latest
        run: npm install && npm run build

      - name: Build docs site
        working-directory: docs-site
        run: npm install && npm run build

      - name: Deploy prod stack
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_RELEASE_CHANNEL: latest
        run: uv run inv deploy --env prod

      - name: Export stack URLs
        id: urls
        run: |
          STACK=ChannelStack
          query() { aws cloudformation describe-stacks --stack-name $STACK --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "api_url_direct=$(query ApiFunctionUrl)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(query ApiFunctionUrl)"  >> "$GITHUB_OUTPUT"
          echo "ui_url=$(query UiUrl)"            >> "$GITHUB_OUTPUT"
          # public_url is the CloudFront distribution URL — the same edge
          # endpoint that serves the UI, which CloudFront also routes to
          # the API origin under /api, /auth, /oauth, /.well-known, /health.
          # Smoke tests hit this so they exercise the full edge path
          # (CloudFront injects X-Origin-Verify, which the Lambda's
          # _verify_origin_secret middleware requires — see #127).
          echo "public_url=$(query UiUrl)"        >> "$GITHUB_OUTPUT"

      - name: Notify Slack — deploy success
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: Deploy to *prod* succeeded — version `${{ needs.release.outputs.version }}`",
              "attachments": [{
                "color": "good",
                "text": "API: ${{ steps.urls.outputs.api_url }}\nUI: ${{ steps.urls.outputs.ui_url }}"
              }]
            }

      - name: Notify Slack — deploy failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: Deploy to *prod* failed — version `${{ needs.release.outputs.version }}`",
              "attachments": [{
                "color": "danger",
                "text": "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }

  e2e-prod:
    name: E2E Tests (prod)
    needs: deploy-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      # All e2e tests require STARTER_BYPASS_GOOGLE_AUTH which is dev-only.
      # Run a lightweight smoke test instead — just verify the prod API is up.
      - name: Smoke test prod API
        env:
          # Hit the CloudFront distribution, NOT the Lambda Function URL
          # directly. CloudFront injects the X-Origin-Verify header that
          # the Lambda's _verify_origin_secret middleware requires (see #127);
          # bypassing CloudFront returns 403. CloudFront's /health behaviour
          # forwards to the API origin, so /health is reachable through
          # the edge. Hitting through CloudFront also validates the full
          # edge path the way real traffic flows.
          STARTER_PUBLIC_URL: ${{ needs.deploy-prod.outputs.public_url }}
        run: |
          # /health must return JSON with .status == 'ok' on a healthy
          # Lambda. AWSLWA returns HTTP 200 even on init failure (the
          # error response body is whatever the runtime emitted — often
          # plaintext like 'Runtime.ImportModuleError: ...', sometimes
          # JSON), so status-only smoke is structurally incapable of
          # catching init failures. Do not unwind this assertion without
          # filing a replacement defense — see #111.
          # -sS surfaces curl-side errors (DNS/TLS/connectivity) instead
          # of silently hiding them; --connect-timeout / --max-time
          # prevent indefinite hangs.
          RESPONSE=$(curl -sS --connect-timeout 5 --max-time 15 -w "\nHTTP_CODE:%{http_code}" "${STARTER_PUBLIC_URL%/}/health")
          STATUS=$(printf '%s\n' "$RESPONSE" | tail -n 1 | sed 's/^HTTP_CODE://')
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          echo "Health check status: $STATUS"
          # Print the body inside a workflow-command group, with each line
          # prefixed, so a malicious/malformed body cannot inject Actions
          # workflow commands (lines starting with '::...' are interpreted
          # by the runner otherwise). Use printf to avoid echo's
          # implementation-defined handling of leading '-n'/'-e' tokens.
          echo "::group::Health check body"
          printf '%s\n' "$BODY" | sed 's/^/  /'
          echo "::endgroup::"
          [ "$STATUS" = "200" ] || (echo "Prod health check HTTP status not 200!" && exit 1)
          HEALTH_STATUS=$(printf '%s\n' "$BODY" | jq -r '.status') || (echo "Prod health check body is not valid JSON!" && exit 1)
          [ "$HEALTH_STATUS" = "ok" ] || (echo "Prod health check .status != 'ok' (got: $HEALTH_STATUS)" && exit 1)

      - name: Notify Slack — e2e failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: E2E tests failed on *prod* after deploy",
              "attachments": [{
                "color": "danger",
                "text": "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }

  back-merge:
    name: Back-merge main → development
    needs: e2e-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create back-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run inv back-merge

      - name: Check back-merge PR for conflicts
        id: conflict_check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the open back-merge PR (head=main, base=development).
          # GitHub computes mergeability asynchronously, so poll for up to
          # ~60s before concluding it's truly DIRTY (conflict) — UNKNOWN
          # often resolves to MERGEABLE within seconds of PR creation.
          #
          # `// empty` ensures jq prints an empty string (not the literal
          # "null") when no PR matches — without it, `[ -z "$PR_NUMBER" ]`
          # mis-treats "null" as a real PR number and the next `gh pr view "null"`
          # call fails with a confusing error.
          PR_NUMBER=$(gh pr list --base development --head main \
            --state open --json number --jq '.[0].number // empty' || true)
          if [ -z "$PR_NUMBER" ]; then
            echo "No back-merge PR open — branches already in sync"
            echo "status=in_sync" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found back-merge PR #$PR_NUMBER — polling mergeable_state"
          STATE=""
          for _ in 1 2 3 4 5 6; do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus \
              --jq '.mergeStateStatus' || true)
            echo "  mergeStateStatus=$STATE"
            if [ "$STATE" != "UNKNOWN" ] && [ -n "$STATE" ]; then
              break
            fi
            sleep 10
          done
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "merge_state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "DIRTY" ]; then
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "::error::Back-merge PR #$PR_NUMBER has conflicts — manual resolution required"
            exit 1
          fi
          echo "status=ok" >> "$GITHUB_OUTPUT"

      # Gated on `status == 'conflict'`, NOT generic `failure()`, so transient
      # gh CLI / API errors (rate limits, 5xx) don't masquerade as conflict
      # alerts. Pipeline failures from other causes are already surfaced by
      # the top-level `notify-pipeline-failure` job — this Slack message is
      # specifically the "I saw the PR sit in DIRTY state" alarm.
      - name: Notify Slack — back-merge conflict
        if: steps.conflict_check.outputs.status == 'conflict' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: Back-merge main → development has conflicts — manual resolution required",
              "attachments": [{
                "color": "warning",
                "text": "PR #${{ steps.conflict_check.outputs.pr_number }} cannot auto-merge (mergeStateStatus=${{ steps.conflict_check.outputs.merge_state }}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }
