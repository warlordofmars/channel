appId: net.warlordofmars.channel.desktop
productName: Channel
copyright: Copyright (c) 2026 John Carter
directories:
  buildResources: resources
  output: release
files:
  - dist-main/**/*
  - dist-renderer/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
linux:
  # Pin the executable name so the binary inside linux-unpacked/ matches
  # the CI smoke step's CHANNEL_DESKTOP_BIN path. Default on Linux is
  # the package.json `name` (`channel-desktop`); we override to `channel`
  # so all three platforms produce a binary derived from `productName`.
  executableName: channel
  target:
    - AppImage
    - deb
    - rpm
  category: Office
