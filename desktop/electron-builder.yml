appId: net.warlordofmars.channel.desktop
productName: Channel
copyright: Copyright (c) 2026 John Carter
directories:
  buildResources: resources
  output: release
files:
  - dist-main/**/*
  - dist-renderer/**/*
  - package.json
asar: true
afterSign: scripts/notarize.js
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Disable electron-builder's built-in auto-notarisation. With
  # `hardenedRuntime: true` + a successful sign, electron-builder would
  # otherwise try its own notarytool call expecting env vars
  # APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER — different from the
  # names our afterSign hook in scripts/notarize.js consumes. We use the
  # afterSign hook instead so it can base64-decode the .p8 from the
  # GH Actions secret at notarise time.
  notarize: false
  # Universal2 binaries: one artefact that runs on both Apple Silicon and Intel.
  # Doubles binary size (~280MB) but means a single stable URL for Channel-mac.dmg
  # and a single latest-mac.yml manifest. Audience is small enough that bandwidth
  # is not a constraint; URL simplicity wins.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # The .zip is the auto-update artefact (electron-updater downloads it by
  # name from the manifest), so it carries the version. `dmg.artifactName`
  # below overrides this for the .dmg only — that one stays at the stable
  # `Channel-mac.dmg` name so releases/latest/download/Channel-mac.dmg
  # always resolves.
  artifactName: "Channel-${version}-${os}.${ext}"
# dmg and zip are TOP-LEVEL configs in electron-builder, not nested under mac.
dmg:
  artifactName: "Channel-${os}.${ext}"
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Channel-Setup.${ext}"
linux:
  # Pin the executable name so the binary inside linux-unpacked/ matches
  # the CI smoke step's CHANNEL_DESKTOP_BIN path. Default on Linux is
  # the package.json `name` (`channel-desktop`); we override to `channel`
  # so all three platforms produce a binary derived from `productName`.
  executableName: channel
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  artifactName: "Channel-linux.${ext}"
publish:
  - provider: generic
    url: "${env.UPDATES_FEED_URL}"
