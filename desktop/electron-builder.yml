appId: net.warlordofmars.channel.desktop
productName: Channel
copyright: Copyright (c) 2026 John Carter
directories:
  buildResources: resources
  output: release
files:
  - dist-main/**/*
  - dist-renderer/**/*
  - package.json
asar: true
afterSign: scripts/notarize.js
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Universal2 binaries: one artefact that runs on both Apple Silicon and Intel.
  # Doubles binary size (~280MB) but means a single stable URL for Channel-mac.dmg
  # and a single latest-mac.yml manifest. Audience is small enough that bandwidth
  # is not a constraint; URL simplicity wins.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  dmg:
    artifactName: "Channel-${os}.${ext}"
  zip:
    artifactName: "Channel-${version}-${os}.${ext}"
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Channel-Setup.${ext}"
linux:
  # Pin the executable name so the binary inside linux-unpacked/ matches
  # the CI smoke step's CHANNEL_DESKTOP_BIN path. Default on Linux is
  # the package.json `name` (`channel-desktop`); we override to `channel`
  # so all three platforms produce a binary derived from `productName`.
  executableName: channel
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  artifactName: "Channel-linux.${ext}"
publish:
  - provider: generic
    url: "${env.UPDATES_FEED_URL}"
