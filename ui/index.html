<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets an installed standalone window draw into the
         notch / home-indicator areas; app.css pays that back with
         env(safe-area-inset-*) padding on the mobile chrome (#437). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Channel</title>
    <meta name="description" content="Channel — an AI agent chat backend on AWS." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installable PWA (#437, Tier 2 of #125).
         iOS does not accept SVG for home-screen icons, so apple-touch-icon
         is a 180x180 PNG. The colour literals below are the computed sRGB
         value of the dark `--canvas` token (oklch(0.183 0.007 58)) from
         ui/src/styles/channel.css — neither a <meta> nor a JSON manifest can
         reference a CSS custom property, so this is the one place the token's
         value is repeated rather than var()'d. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#15120f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style (#516). `black-translucent`
         moves the standalone web view's origin to y=0 so it draws under the
         status bar, but iOS does NOT grow the view to compensate: measured on
         an installed PWA it stayed 793pt tall on an 852pt screen, so the 59pt
         gained at the top was lost as dead screen below the page — unpaintable
         by any CSS, which is why #508 / #510 made the composer flush at 793 and
         a band still remained. Without the meta iOS lays the same 793pt view
         out at 59 → 852 and it reaches the bottom edge. Re-adding this tag
         reintroduces that band. -->
    <meta name="apple-mobile-web-app-title" content="Channel" />

    <!-- Google Analytics 4 — gated on the consent banner. Only loads when
         VITE_GA_MEASUREMENT_ID is set AND the visitor has opted in. -->
    <script>
      (function () {
        var id = "%VITE_GA_MEASUREMENT_ID%";
        if (!id) return;
        try {
          if (localStorage.getItem("starter_ga_consent") !== "accept") return;
        } catch (e) {
          return;
        }
        var s = document.createElement("script");
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        s.async = true;
        s.dataset.starterGa = "1";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id, { send_page_view: false });
      })();
    </script>
    <!-- Set theme before first paint to prevent flash of wrong background colour -->
    <script>
      (function () {
        var stored = localStorage.getItem("starter_theme");
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
