# SonarCloud project configuration
# https://sonarcloud.io/project/overview?id=warlordofmars_channel

sonar.projectKey=warlordofmars_channel
sonar.organization=warlordofmars

# Sources and tests
# ui/src appears in both: its production modules are sources, while the
# co-located *.test.* files and the vitest bootstrap are tests.
# sonar.test.inclusions is what splits the overlap.
sonar.sources=src/channel,ui/src
sonar.tests=tests,ui/src
sonar.test.inclusions=tests/**,ui/src/**/*.test.*,ui/src/setupTests.js

# Exclude generated, vendor, and infra files from analysis
sonar.exclusions=**/__pycache__/**,**/*.pyc,infra/**,ui/node_modules/**,ui/dist/**,ui/coverage/**

# Python coverage (combined unit + integration — most comprehensive)
sonar.python.coverage.reportPaths=coverage-combined.xml
sonar.python.version=3.12

# JavaScript/JSX coverage
sonar.javascript.lcov.reportPaths=lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Quality gate — PR decoration only, deliberately NON-blocking (#246, #541).
#
# `Sonar way` evaluates entirely on *new code*. With no established new-code
# baseline the gate returns `status: NONE, conditions: []`, and the scanner's
# wait treats an unresolvable gate as a failure (exit 3) — so `true` failed
# every `development` push on a gate that had evaluated nothing, the day the
# scan first ran for real.
#
# The accepted posture (#246) is decoration, not gating: analysis, PR comments
# and the SARIF upload to the Security tab all still happen. If this is ever
# flipped back, first confirm the gate actually evaluates — a build that fails
# on `NONE` is not a quality signal.
sonar.qualitygate.wait=false
sonar.qualitygate.timeout=300

# Suppress PropTypes rule — not used in this project (no TypeScript)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S6774
sonar.issue.ignore.multicriteria.e1.resourceKey=**
